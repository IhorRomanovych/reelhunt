# Linux build and the data-free tests (the game data is never available in CI: those tests skip).
name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build clang-20 \
            libvulkan-dev glslang-tools libopenal-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libasound2-dev libpulse-dev

      - name: Configure
        run: |
          if [ "${{ matrix.compiler }}" = clang ]; then export CC=clang-20 CXX=clang++-20; fi
          cmake -S . -B _build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build _build

      - name: Test
        run: ctest --test-dir _build --output-on-failure

      - name: Package
        if: matrix.compiler == 'gcc'
        run: |
          cmake --install _build --prefix "$PWD/dist/Reelhunt-linux-x86_64" --strip
          tar -C dist -czf Reelhunt-linux-x86_64.tar.gz Reelhunt-linux-x86_64

      - uses: actions/upload-artifact@v4
        if: matrix.compiler == 'gcc'
        with:
          name: Reelhunt-linux-x86_64
          path: Reelhunt-linux-x86_64.tar.gz
